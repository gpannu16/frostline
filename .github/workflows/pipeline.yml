
      - name: Deploy to Amazon ECS
        id: ecs-deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task.outputs.task-definition }}
          cluster: frostline-cluster
          service: frostline-api
          wait-for-service-stability: true
          wait-max-delay-seconds: 15

      - name: Confirm ECS rollout completed
        env:
          EXPECTED_TASK_DEFINITION: ${{ steps.ecs-deploy.outputs.task-definition-arn }}
        run: |
          for attempt in $(seq 1 90); do
            SERVICE=$(aws ecs describe-services \
              --cluster frostline-cluster \
              --services frostline-api \
              --region us-west-2 \
              --output json)

            PRIMARY_TASK=$(echo "$SERVICE" | jq -r \
              '.services[0].deployments[] | select(.status == "PRIMARY") | .taskDefinition')

            ROLLOUT=$(echo "$SERVICE" | jq -r \
              '.services[0].deployments[] | select(.status == "PRIMARY") | .rolloutState // "UNKNOWN"')

            RUNNING=$(echo "$SERVICE" | jq -r '.services[0].runningCount')
            DESIRED=$(echo "$SERVICE" | jq -r '.services[0].desiredCount')
            PENDING=$(echo "$SERVICE" | jq -r '.services[0].pendingCount')

            echo "Expected: $EXPECTED_TASK_DEFINITION"
            echo "Primary: $PRIMARY_TASK | Rollout: $ROLLOUT | Running: $RUNNING/$DESIRED | Pending: $PENDING"

            if [ "$ROLLOUT" = "FAILED" ]; then
              echo "ECS deployment rollout failed."
              exit 1
            fi

            if [ "$PRIMARY_TASK" = "$EXPECTED_TASK_DEFINITION" ] && \
               [ "$ROLLOUT" = "COMPLETED" ] && \
               [ "$RUNNING" -eq "$DESIRED" ] && \
               [ "$PENDING" -eq 0 ]; then
              echo "Expected task definition is fully deployed."
              exit 0
            fi

            sleep 10
          done

          echo "Timed out waiting for the expected ECS rollout to complete."
          exit 1

